name: air
on:
  schedule:
    - cron: '40 10 * * *'
    - cron: '40 16 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cdsapi netCDF4 numpy
      - run: python cams_tiles.py site
        env:
          ADS_KEY: ${{ secrets.ADS_KEY }}
      # The rest of the world's air (CAMS global): its own step, so a failure there leaves Europe's alone.
      - run: python global_air.py site
        continue-on-error: true
        env:
          ADS_KEY: ${{ secrets.ADS_KEY }}
      # The chance of rain by day worldwide (ECMWF open data): its own step too.
      - run: pip install eccodes && python ecmwf_rain.py site
        continue-on-error: true
      # Wind gusts worldwide (ECMWF open data), likewise on their own.
      - run: python ecmwf_gust.py site
        continue-on-error: true
      # The sea's temperature (Copernicus Marine): skipped until the account's secrets are set.
      - run: pip install copernicusmarine && python sea_tiles.py site
        env:
          CMEMS_USER: ${{ secrets.CMEMS_USER }}
          CMEMS_PASS: ${{ secrets.CMEMS_PASS }}
      # Precipitation for the map, finer than MET Norway's points (DWD ICON-EU, ECMWF IFS): its own step too.
      - run: python precip_tiles.py site
        continue-on-error: true
      # The sea in motion for the map (currents, waves): its own step, so a failure leaves the rest alone.
      - run: python sea_motion.py site
        continue-on-error: true
        env:
          CMEMS_USER: ${{ secrets.CMEMS_USER }}
          CMEMS_PASS: ${{ secrets.CMEMS_PASS }}
      # Sea level (the Baltic) and sea ice (the polar seas, the Baltic): a step of its own too.
      - run: python sea_extra.py site
        continue-on-error: true
        env:
          CMEMS_USER: ${{ secrets.CMEMS_USER }}
          CMEMS_PASS: ${{ secrets.CMEMS_PASS }}
      # The bathing places (beaches.py, refreshed by hand once a year) go out beside the tiles.
      - run: cp -r beaches site/b && if [ -d salinity ]; then cp -r salinity site/sal; fi && if [ -d seaclimate ]; then cp -r seaclimate site/sc; fi && if [ -d stations ]; then cp -r stations site/st; fi
      - name: Publish
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="Livonian Labs" -c user.email="livonianlabs@gmail.com" commit -q -m "Air quality $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
